name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm validate-data
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm coverage
      - name: Smoke test the built CLI
        run: node dist/cli.js --version
      - name: Smoke test every tool through the MCP Inspector CLI
        run: bash scripts/inspector-smoke.sh

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile the extraction pipeline
        run: python -m py_compile pipeline/*.py
      - name: Check the pipeline shell scripts parse
        run: bash -n pipeline/ocr.sh && bash -n pipeline/run.sh
